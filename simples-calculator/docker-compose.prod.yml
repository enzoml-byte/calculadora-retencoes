services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    container_name: simples-backend-prod
    ports:
      - "3001:3001"
    volumes:
      - sqlite_prod_data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/prod.db
      - PORT=3001
    networks:
      - simples-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    container_name: simples-frontend-prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - simples-network
    restart: always

volumes:
  sqlite_prod_data:
    driver: local

networks:
  simples-network:
    driver: bridge