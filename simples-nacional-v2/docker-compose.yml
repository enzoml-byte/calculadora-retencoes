services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: "file:/data/prod.db"
      PORT: "3001"
    volumes:
      - sqlite_data:/data
    expose:
      - "3001"
    networks:
      - v2net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - v2net

volumes:
  sqlite_data:

networks:
  v2net:
