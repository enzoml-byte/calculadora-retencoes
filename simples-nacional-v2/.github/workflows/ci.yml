name: ci
on:
  push:
  pull_request:

jobs:
  v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: simples-nacional-v2/pnpm-lock.yaml
      - working-directory: simples-nacional-v2
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @v2/api db:generate
          pnpm -r --if-present typecheck
          pnpm --filter @v2/domain test
          pnpm --filter @v2/api test
          pnpm --filter @v2/api build
          pnpm --filter @v2/web build
